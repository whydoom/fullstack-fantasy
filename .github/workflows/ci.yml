name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # See CLAUDE.md "Environment": dagster-dbt's latest release pins an exact
          # dagster version whose Requires-Python excludes 3.14 — 3.12 is the version
          # this whole stack is verified against.
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Commands run from the repo root with explicit --project-dir/--profiles-dir,
      # matching local usage documented in CLAUDE.md.
      - name: dbt deps
        run: dbt deps --project-dir transform --profiles-dir transform

      # nflverse needs no credentials, so CI can build against real data — it fetches
      # the same public parquet the developer machine does (~4 MB for 2020-present).
      # This is what makes the dbt tests meaningful in CI rather than vacuous: grain
      # and relationship tests run against the actual dataset on every PR.
      #
      # The Yahoo half is different and stays out: it needs OAuth credentials this
      # public repo must never hold, so no Yahoo model can be built here. When Yahoo
      # models land, gate them out of the CI selection rather than adding secrets.
      - name: Ingest nflverse (no credentials required)
        run: python -m src.ingest.nflverse

      - name: Load raw parquet into DuckDB
        run: python -m src.load.duckdb_raw

      - name: dbt build
        run: dbt build --project-dir transform --profiles-dir transform
