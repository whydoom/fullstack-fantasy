# The Wednesday waivers report: the claims that went through overnight, to each
# league that has wednesday_waivers on (src/ingest/leagues.py notify) -- GroupMe
# or email. 6:07 Eastern every Wednesday, after the night's claims (Yahoo's run
# about 3:43, ESPN's about 4:04). 6:37 and 7:07 are backups -- GitHub drops scheduled
# runs now and then -- and do nothing once a league's report has gone out.
#
# Pulls the leagues' transactions fresh (Yahoo through the warehouse plus its public
# FAB Offers page for the losing bids, ESPN's pickups and claims straight from ESPN), fills in the rest from what jimoody.com published
# Tuesday, and builds the report with src/notify/waivers.py. Sends once per league
# and week (a cache entry remembers); a week with no claims sends nothing.
#
# Public logs: no step prints league data. Secrets: the Yahoo app and token, the
# ESPN cookies, SITE_REPO_TOKEN, SMTP_USER / SMTP_PASSWORD, GROUPME_BOT_ID and each
# league's address secret named in its notify (MAIL_TO_CF).
name: Wednesday waivers

on:
  # 6:07, 6:37 and 7:07 Eastern, in UTC for both halves of the year (EDT is UTC-4,
  # EST UTC-5); the first step lets through only the ones that are those Eastern
  # times today. Off the hour: GitHub drops :00 runs most.
  schedule:
    - cron: "7 10 * * 3"
    - cron: "37 10 * * 3"
    - cron: "7 11 * * 3"
    - cron: "37 11 * * 3"
    - cron: "7 12 * * 3"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to report (default: the one after the latest final week)"
        required: false
      only_me:
        description: "Send every report to SMTP_USER by email instead (a test; no GroupMe post)"
        type: boolean
        default: true
      force:
        description: "Send even if this week was already sent"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wednesday-waivers
  cancel-in-progress: false

jobs:
  waivers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FFF_PIPELINE_DIR: ${{ github.workspace }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      ESPN_S2_CF: ${{ secrets.ESPN_S2_CF }}
      ESPN_SWID_CF: ${{ secrets.ESPN_SWID_CF }}
      ESPN_S2_FL: ${{ secrets.ESPN_S2_FL }}
      ESPN_SWID_FL: ${{ secrets.ESPN_SWID_FL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Only at 6:07, 6:37 or 7:07 Eastern, for leagues with this send on
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # the cron's own UTC time, as Eastern today (not the clock: runs start late)
            set -- $CRON
            offset=$(TZ=America/New_York date +%z)            # -0400 or -0500
            et=$(( ($2 + ${offset:0:3}) * 60 + $1 ))           # minutes after midnight
            case "$et" in 367|397|427) ;; *)
              echo "Cron $CRON is not 6:07/6:37/7:07 Eastern today; skipping."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          leagues=$(python3 -m src.notify.plan wednesday_waivers | cut -d' ' -f1 | tr '\n' ' ')
          echo "leagues=$leagues" >> "$GITHUB_OUTPUT"
          if [ -z "${leagues// }" ]; then echo "No league has wednesday_waivers on."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out jimoody.com
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: whydoom/jimoody.com
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -q -r requirements.txt
          dbt deps --project-dir transform --profiles-dir transform > /dev/null

      - name: Yahoo token
        if: steps.gate.outputs.go == 'true'
        env:
          YAHOO_TOKEN_JSON: ${{ secrets.YAHOO_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$YAHOO_TOKEN_JSON" > .secrets/token.json
          chmod 600 .secrets/token.json

      # Every data step keeps its output out of the log (league data); errors still show.
      - name: Pull the transactions
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m src.ingest.discover > /dev/null
          python -m src.ingest.yahoo_season "$(python -c 'from src.ingest.discover import latest_league_key as k; from src.ingest.leagues import LEAGUES; print(k(LEAGUES["adn"]["yahoo_league_name"]))')" > /dev/null
          python -m src.load.yahoo_raw > /dev/null
          # only the Yahoo models the exports read: nothing here needs nflverse (the
          # export's "did he play?" check falls back to Yahoo's own flag without it)
          dbt seed --project-dir transform --profiles-dir transform --quiet
          dbt run --project-dir transform --profiles-dir transform --quiet --select             +dim_team_season +fct_roster_slot +fct_matchup +fct_player_rank +fct_team_week_allplay             +fct_transaction +stg_yahoo__roster_positions +stg_yahoo__matchup_teams             +stg_yahoo__team_snapshots +stg_yahoo__transaction_players
          python yahoo_site_export.py > /dev/null
          # Yahoo's losing bids: only on the league's public FAB Offers page (for the
          # FAAB chart's second bids and overspend). Without it, no overspend this week.
          python -m src.ingest.yahoo_faab_offers > /dev/null || echo "Yahoo's FAB Offers page could not be read; no second bids for Yahoo leagues."
          python faab_adn.py > /dev/null
          python pickups_espn.py > /dev/null
          python claims_espn.py > /dev/null
          # what the report reads but the night did not change (team tags, weeks):
          # from what the site published Tuesday, never over a fresh file
          for d in site/fixtures/processed/*/; do
            mkdir -p "data/processed/$(basename "$d")"
            cp -n "$d"*.json "data/processed/$(basename "$d")/"
          done

      - name: Build the reports
        if: steps.gate.outputs.go == 'true'
        env:
          WEEK_IN: ${{ inputs.week }}
        run: |
          # the week after the latest one jimoody.com published as final
          week=${WEEK_IN:-$(( $(python -m src.notify.groupme_congrats --site site --league adn --latest-week) + 1 ))}
          echo "WEEK=$week" >> "$GITHUB_ENV"
          python -m src.notify.plan wednesday_waivers > "$RUNNER_TEMP/plan.txt"
          while read -r league via secret; do
            python -m src.notify.waivers --site site --league "$league" --week "$week" --out "out/$league" < /dev/null
          done < "$RUNNER_TEMP/plan.txt"

      - name: Already sent this week?
        id: done
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .waivers-sent
          key: wednesday-waivers-${{ env.WEEK }}-${{ github.run_id }}
          restore-keys: wednesday-waivers-${{ env.WEEK }}-

      - name: Send
        if: steps.gate.outputs.go == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          MAIL_TO_CF: ${{ secrets.MAIL_TO_CF }}
          ONLY_ME: ${{ github.event_name == 'workflow_dispatch' && inputs.only_me }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          mkdir -p .waivers-sent
          while read -r league via secret; do
            out="out/$league"
            [ -f "$out/waivers.txt" ] || { echo "$league week $WEEK: no claims; nothing sent"; continue; }
            if [ -f ".waivers-sent/$league" ] && [ "$FORCE" != "true" ]; then
              echo "$league week $WEEK: already sent"; continue
            fi
            if [ "$ONLY_ME" = "true" ]; then
              MAIL_TO="$SMTP_USER" MAIL_CC="" python -m src.notify.send_email \
                --subject-file "$out/waivers_subject.txt" --html "$out/waivers.html" --text "$out/waivers.txt" < /dev/null
              echo "$league week $WEEK: test email to SMTP_USER"
              continue                          # a test does not count as sent
            elif [ "$via" = "groupme" ]; then
              python -m src.notify.groupme --text-file "$out/waivers.txt" < /dev/null
            elif [ "$via" = "email" ]; then
              to="${!secret}"
              [ -n "$to" ] || { echo "$league: $secret is empty; skipped"; continue; }
              MAIL_TO="$to" MAIL_CC="" python -m src.notify.send_email \
                --subject-file "$out/waivers_subject.txt" --html "$out/waivers.html" --text "$out/waivers.txt" < /dev/null
            fi
            echo "$league week $WEEK: sent by $via"
            touch ".waivers-sent/$league"
          done < "$RUNNER_TEMP/plan.txt"

      - name: Remember what was sent
        if: always() && steps.gate.outputs.go == 'true' && hashFiles('.waivers-sent/*') != ''
        uses: actions/cache/save@v4
        with:
          path: .waivers-sent
          key: wednesday-waivers-${{ env.WEEK }}-${{ github.run_id }}

      - name: Email -- the waivers report failed
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from src.notify.send_email import send
          send("[FFF] Wednesday waivers failed",
               "The waivers report stopped partway. The run shows which step and why:\n\n"
               f"{os.environ['RUN_URL']}\n\nFix it, then Actions > Wednesday waivers > Run workflow.\n",
               to=[os.environ["SMTP_USER"]])
          PY
