version: 2

# Every test below was checked against landed data before being written — these
# assert grains that actually hold, not grains that seem plausible.

models:
  - name: stg_nflverse__player_stats_weekly
    description: >
      One row per player per game. nflverse weekly box scores, 2020-present, regular
      season and postseason, typed and renamed. Rows with no player identity are
      excluded — see the model's where clause.
    columns:
      - name: player_id
        description: nflverse GSIS player id. Stable across seasons; the join key to Yahoo player identity.
        tests:
          - not_null
      - name: game_id
        description: nflverse game id. Joins to stg_nflverse__schedules.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nflverse__schedules')
                field: game_id
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: season_type
        description: REG or POST. Part of the grain — week numbers restart conceptually between them.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REG', 'POST']
    tests:
      # The grain. player_id alone repeats across weeks, and (player_id, season, week)
      # would collide if a player appeared in both REG and POST week 18+, so
      # season_type is part of the key rather than an attribute.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
              - week
              - season_type

  - name: stg_nflverse__schedules
    description: >
      One row per NFL game, 2020-present, including postseason. Dates, times and
      0/1 flags typed to date, time and boolean respectively.
    columns:
      - name: game_id
        description: nflverse game id, unique per game. The grain.
        tests:
          - unique
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: game_type
        description: REG, plus the postseason rounds WC / DIV / CON / SB.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REG', 'WC', 'DIV', 'CON', 'SB']
      - name: game_date
        tests:
          - not_null
      - name: home_team_abbr
        tests:
          - not_null
      - name: away_team_abbr
        tests:
          - not_null

  - name: stg_nflverse__player_id_crosswalk
    description: >
      One row per player, current cross-platform ID mapping. Deduplicated on
      player_id (see model SQL) so this is safe to join on directly.
    columns:
      - name: player_id
        description: nflverse player id (DynastyProcess's gsis_id, renamed for consistency with the rest of this project).
        tests:
          - unique
          - not_null

  - name: stg_nflverse__pbp
    description: >
      One row per play, every play kept. Typed and renamed; ~90 of nflverse's 372
      columns (situation, result, yardage, every player id, EPA / WPA).
    columns:
      - name: game_id
        tests:
          - not_null
      - name: play_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, play_id]

  - name: stg_nflverse__snap_counts
    description: One row per player per game; snap counts and share (PFR ids).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, pfr_player_id]

  - name: stg_nflverse__ff_opportunity_weekly
    description: >
      One row per player per game: actual and usage-expected stat components, so
      they can be scored under each league's rules.
    columns:
      - name: player_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]

  - name: stg_nflverse__ftn_charting
    description: One row per charted play; joins one to one to stg_nflverse__pbp.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, play_id]
