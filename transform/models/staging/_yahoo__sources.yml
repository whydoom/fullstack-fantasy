version: 2

# Real tables, created by `python -m src.load.yahoo_raw` from the JSON landed under
# data/raw/{season}/{league_key}/ — the same load-then-source pattern as nflverse,
# replacing the earlier read_json_auto placeholder. A resource is added here only once
# its payloads have been landed and its staging model written against them.
#
# CI never builds these: they need OAuth credentials the public repo must not hold.
# ci.yml excludes `source:raw_yahoo+`, so every model downstream of this source is
# left out automatically.

sources:
  - name: raw_yahoo
    description: >
      Untouched Yahoo Fantasy API payloads. One row per landed file: its path and
      its JSON, including the `_meta` wrapper fetch_and_land adds (resource_path,
      season, fetched_at). No parsing happens before the stg_yahoo__* models.
    schema: raw_yahoo
    tables:
      - name: rosters
        description: >
          One row per team per week. Each payload is a team's roster for that week
          from `team/{team_key}/roster;week={n}/players/stats;type=week;week={n}`:
          every player on it, the lineup slot they were in, and their fantasy points.
        columns:
          - name: landed_file
            description: Absolute path of the landed JSON file.
            tests:
              - unique
              - not_null
          - name: payload
            description: The landed document, untouched.
            tests:
              - not_null
