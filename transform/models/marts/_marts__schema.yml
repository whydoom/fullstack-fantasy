version: 2

# Yahoo-side model SQL isn't written yet — see CLAUDE.md; API access is pending
# review. This file still scaffolds the grain/test contract for those marts so the
# dimensional model is decided before writing SQL against real payload shapes.
# `dbt debug` passes without those models existing; `dbt parse`/`dbt build` warn
# (not error) about the missing nodes. fct_roster_slot is the atomic fact on the
# Yahoo side; every other Yahoo fact/dim rolls up from it.
#
# The nflverse-side marts (dim_player, dim_game, fct_player_week) are real: built,
# tested against landed data, and passing. fct_player_week is the atomic fact on the
# nflverse side — real NFL production, independent of anything Yahoo-specific.

models:
  - name: dim_manager
    description: >
      One row per human, tracked across seasons and across team-name changes within
      a season. Yahoo identifies teams by team_key per season, not by manager — this
      model exists to give a stable identity for "who" independent of "what they
      named their team that year."
    columns:
      - name: manager_id
        description: Surrogate key, stable across all seasons for a given human.
        tests:
          - unique
          - not_null

  - name: dim_team_season
    description: >
      One row per team as it existed in a single league-season, with its manager.
      Type 1 (latest-fetched attributes). Every Yahoo fact joins to it on
      (league_key, team_id); tests/assert_yahoo_facts_have_team.sql enforces that,
      since dbt's relationships test cannot take a composite key.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: team_name
        tests:
          - not_null
      - name: manager_nickname
        description: >
          Display name the manager set on Yahoo. Not a stable identity: Yahoo hides
          account ids, so this does not link the same person across seasons.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - team_id

  - name: dim_player
    description: >
      One row per NFL player, most-recently-known attributes. Built now from
      nflverse (grain: player_id, nflverse's GSIS id) — the original scaffold below
      assumed Yahoo's player_key because that was the only source planned when this
      file was written; nflverse landed first, so the real model's grain differs.
      Carries a nullable yahoo_id (from the player ID crosswalk) as the intended
      reconciliation key once Yahoo data lands — see the model SQL.
    columns:
      - name: player_id
        tests:
          - unique
          - not_null

  - name: dim_game
    description: >
      One row per NFL game, 2020-present including postseason: the typed game record
      plus its fantasy timing -- slot, slate, region (US / Europe / International,
      from seed nfl_venues) and primetime (8pm ET or later, in the US).
    columns:
      - name: game_id
        tests:
          - unique
          - not_null
      - name: slot
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['thursday_night', 'thursday_day', 'sunday_early', 'sunday_late',
                         'sunday_night', 'monday', 'other_day']
      - name: slate
        tests:
          - accepted_values:
              arguments:
                values: ['thursday', 'sunday_day', 'sunday_night', 'monday', 'other_day']
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ['US', 'Europe', 'International']

  - name: fct_player_week
    description: >
      Atomic fact for the nflverse side of this project: one row per player per
      game. NFL production, independent of any fantasy league — the counterpart to
      the (not yet built) Yahoo-side fct_roster_slot, which will record what was
      *rostered* rather than what actually happened on the field.
    columns:
      - name: player_id
        description: Foreign key to dim_player.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
      - name: game_id
        description: Foreign key to dim_game.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_id
      - name: season
        tests:
          - not_null
      - name: week
        description: >
          Not hardcoded anywhere in this project: 2020's regular season ran through
          week 17, 2021 onward runs through week 18 (the league expanded its
          schedule), and postseason weeks continue the numbering at 21-22 rather
          than resetting. Any model that needs "how many weeks this season" must
          derive it (e.g. max(week) from dim_game filtered to game_type), never
          assume a constant.
        tests:
          - not_null
      - name: season_type
        description: REG or POST. Part of the grain, not an attribute — see below.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REG', 'POST']
    tests:
      # The grain, restated here (not just in staging) because this is the contract
      # a mart consumer should be able to read without also opening the staging
      # model. Verified zero duplicates against landed data before this test was
      # written — see stg_nflverse__player_stats_weekly's identical test.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
              - week
              - season_type

  - name: fct_roster_slot
    description: >
      Atomic fact: one row per league-week-team-player, capturing whether that
      player was started or benched and the points they scored that week. Built
      from stg_yahoo__roster_slots; grain verified against landed 2026 data
      (741 rows, weeks 1-4) before this test was written.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: player_key
        tests:
          - not_null
      - name: yahoo_player_id
        description: >
          Numeric tail of player_key, stable across seasons. The key a future
          conformed dim_player will join on (not wired up yet; see the model SQL).
        tests:
          - not_null
      - name: is_starter
        description: >
          True for every slot except bench (BN) and injured reserve (IR). The single
          definition of "started" that every Yahoo team-week measure rolls up from.
        tests:
          - not_null
      - name: fantasy_points
        description: Points scored that week, started or not. Additive.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - week
              - team_id
              - player_key

  - name: fct_matchup
    description: >
      One row per league-week-team, capturing that team's side of its matchup:
      the team's score, the opponent's, and the result once the week is final.
      Each matchup appears twice, once per side. team_points is the sum of the
      team's started roster slots (what Yahoo's matchup page shows); the
      scoreboard API's own total is kept as reported_points, and any difference
      is reported as a warning by tests/assert_yahoo_reported_score_matches_starters.sql.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: result
        description: W, L or T once the week is final; null while it is in progress.
        tests:
          - accepted_values:
              arguments:
                values: [W, L, T]
      - name: team_points
        tests:
          - not_null
      - name: opponent_points
        description: The opponent's team_points. Null would mean an unmatched side.
        tests:
          - not_null
      - name: reported_points
        description: >
          The scoreboard API's total for this team. Equal to team_points unless the
          API disagrees with its own player points (ADN 2026 week 5, team 6).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - week
              - team_id

  - name: fct_draft_pick
    description: One row per draft pick made in a league-season's draft.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: pick_number
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - pick_number

  - name: fct_transaction
    description: >
      One row per player affected by a transaction (an add/drop or a trade moving
      two players is two rows sharing a transaction_id). faab_bid sits on the add
      leg only. league_key is part of the grain because Yahoo numbers transactions
      from 1 in every league. FAAB balances are reconciled against it by
      tests/assert_yahoo_faab_balance_reconciles.sql.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: transaction_id
        tests:
          - not_null
      - name: player_key
        tests:
          - not_null
      - name: week
        description: Fantasy week the move falls in (US Eastern); preseason moves are week 1.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - transaction_id
              - player_key

  - name: fct_player_rank
    description: >
      One row per league, period (W01..Wnn or SEASON), position group and player:
      points and deterministic positional rank under the league's scoring. Covers
      the landed top 75 per position; deeper players have no rank.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_key, period_key, position_group, player_key]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_key, period_key, position_group, position_rank]
    columns:
      - name: position_rank
        tests: [not_null]

  - name: fct_team_week_allplay
    description: >
      One row per league, final regular-season week and team: all-play record,
      expected wins, vs-median and close-game flags. Same definitions as the ESPN
      pipeline's espn_luck.py. Expected wins summing to n/2 per week is enforced by
      tests/assert_allplay_expected_wins_sum_to_half.sql.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_key, week, team_id]
    columns:
      - name: expected_wins
        tests: [not_null]

  - name: fct_play_player
    description: >
      One row per player per play (deleted plays dropped): every fantasy stat he is
      credited with on it -- passing / receiving / rushing yards and TDs, receptions,
      return TDs, and the defensive stats (tackles, assists, TFL, sacks incl. halves,
      INT, forced fumbles, defensive recoveries, passes defended, blocked kicks,
      safeties, defensive TDs). Raw counts; fct_play_points scores them.
    columns:
      - name: player_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, play_id, player_id]

  - name: fct_play_points
    description: >
      One row per player per play per league: the play's fantasy points under that
      league's scoring (seed league_scoring), with garbage-time, red-zone, big-play,
      vulture and defensive-TD flags. Rows worth nothing are dropped except
      touchdowns and red-zone touches (kept for red-zone share).
    columns:
      - name: league
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_scoring')
                field: league
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league, game_id, play_id, player_id]

  - name: fct_player_week_targets
    description: >
      One row per player per game he was targeted: targets, catches, drops (FTN),
      interceptions and other incompletions, with FTN's catchable / contested counts
      and how many targets FTN has charted (it runs about a day behind).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "other_incompletions >= 0 and catches + drops <= targets"

  - name: fct_player_week_usage
    description: >
      One row per player per game: offensive snaps and snap share (PFR), target and
      carry share of his team's, and is_workhorse (70%+ of the team's snaps).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]

  - name: fct_player_week_expected
    description: >
      One row per player per game per league: points scored and points his usage
      was expected to score (nflverse ffopportunity), both under the league's
      scoring, and the difference.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league, game_id, player_id]
