version: 2

# Hand-maintained lookup tables (CSV in this folder, loaded by `dbt seed`).

seeds:
  - name: league_scoring
    description: >
      One row per fantasy league: points per yard, touchdown, reception and IDP stat,
      used to put a fantasy value on every play and every expected stat. Edit the CSV
      to change a league's scoring; `notes` says how exact each row is.
    columns:
      - name: league
        description: The league key, as in src/ingest/leagues.py.
        tests:
          - unique
          - not_null

  - name: player_names
    description: >
      One row per player rostered in any league this season (team defences one row
      per NFL team): ids and names on nflverse, ESPN and Yahoo, a custom display_name
      and a normalized match_key. Generated by build_player_names.py, which keeps
      every display_name already in the file -- so edit display_name freely.
    columns:
      - name: display_name
        tests:
          - not_null
      - name: match_key
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, team, espn_id, yahoo_id]

  - name: nfl_venues
    description: >
      Stadiums outside the US and the region each is in (Europe or International),
      for dim_game. A stadium not listed is treated as in the US.
    columns:
      - name: stadium_name
        tests:
          - unique
          - not_null
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ['Europe', 'International']
